<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>Scene Snap | Workroom</title><style>
:root{--ink:#293830;--muted:#6e7a72;--paper:#f5f4ef;--white:#fffefa;--line:#e4e4dc;--green:#e5eee4;--berry:#a6505c;--orange:#e9a96f}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{min-height:100vh;display:grid;grid-template-columns:228px 1fr}.side{background:#27372f;color:#f5f4ef;padding:25px 16px;display:flex;flex-direction:column}.brand{font:700 24px Georgia,serif;padding:0 13px 28px}.brand i{color:#e8aa79;font-style:normal}.side .label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#aab8ae;padding:17px 13px 8px}.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;color:#d8e2da;background:transparent;text-align:left;border-radius:10px;padding:10px 12px;font-size:14px}.nav button.active,.nav button:hover{background:#3c5146;color:#fff}.foot{margin-top:auto;padding:16px 13px;font-size:12px;color:#bbc6be;border-top:1px solid #45564d}.main{min-width:0}.top{height:72px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.top .left{display:flex;align-items:center;gap:15px}.badge{padding:5px 9px;background:#edf3eb;color:#55715d;border-radius:99px;font-size:11px;font-weight:700}.user{border:0;background:transparent;display:flex;align-items:center;gap:10px;text-align:left}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f0d8ca;font-size:14px;font-weight:700}.wrap{max-width:1300px;margin:auto;padding:30px 34px 60px}.eyebrow{text-transform:uppercase;letter-spacing:1.7px;color:var(--berry);font-size:10px;font-weight:800}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.title h1{font:38px/1.05 Georgia,serif;letter-spacing:-.8px;margin:8px 0 5px}.title p{color:var(--muted);margin:0}.btn{border:0;border-radius:9px;background:var(--ink);color:white;padding:11px 15px;font-size:13px;font-weight:700}.btn.alt{background:var(--white);border:1px solid var(--line);color:var(--ink)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.metric{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:18px}.metric .topline{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.metric strong{display:block;font:30px Georgia,serif;margin:9px 0 2px}.metric small{color:#68766e;font-size:11px}.metric .bubble{background:var(--green);padding:7px;border-radius:9px}.columns{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.panel{background:var(--white);border:1px solid var(--line);border-radius:15px;overflow:hidden}.panelhead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.panelhead h2{font:21px Georgia,serif;margin:0}.link{border:0;background:none;color:var(--berry);font-size:12px;font-weight:700}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 16px;border-bottom:1px solid #efeee8;text-align:left;font-size:12px;white-space:nowrap}.table th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}.table tr:last-child td{border:0}.status{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:4px 8px;background:#edf3eb;color:#526e58;font-size:10px;font-weight:700}.status:before{content:"";height:6px;width:6px;background:#6d9a72;border-radius:50%}.status.wait{background:#fbf0e4;color:#946332}.status.wait:before{background:#dc9a4c}.status.review{background:#f5e9e9;color:#99545b}.status.review:before{background:#c07479}.list{padding:5px 20px}.row{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid #efeee8}.row:last-child{border:0}.datebox{width:42px;height:45px;border-radius:9px;background:#f5eee7;display:grid;place-content:center;text-align:center;line-height:1.05}.datebox b{font-size:18px}.datebox small{font-size:9px;color:var(--muted)}.rowinfo{flex:1}.rowinfo strong{display:block;font-size:13px}.rowinfo span{font-size:11px;color:var(--muted)}.rowinfo .status{margin-top:5px}.season{margin-top:17px;background:#e5eee4;border-radius:15px;padding:18px 20px;display:flex;justify-content:space-between;gap:20px;align-items:center}.season h3{font:22px Georgia,serif;margin:0 0 5px}.season p{font-size:12px;color:#637267;margin:0}.season .progress{margin-top:10px;height:6px;border-radius:99px;background:#d0dfd0;overflow:hidden}.season .progress i{display:block;background:#63866a;width:64%;height:100%;border-radius:99px}.bar{min-width:120px;text-align:right;font-size:12px}.bar b{font-size:21px}.tabs{display:flex;gap:8px;margin:0 0 16px}.tab{border:1px solid var(--line);background:var(--white);border-radius:99px;padding:7px 12px;font-size:12px;color:var(--muted)}.tab.active{background:var(--ink);color:white}.hidden{display:none!important}.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;padding:16px}.stock{border:1px solid var(--line);border-radius:12px;padding:14px}.stock strong{font-size:13px;display:block}.stock span{font-size:11px;color:var(--muted)}.stock b{display:block;margin-top:9px;font-size:12px}.staffcards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.staff{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:18px}.stafftop{display:flex;align-items:center;gap:10px}.staff h3{margin:0;font-size:14px}.staff p{font-size:11px;color:var(--muted);margin:2px 0}.staff .perm{border-top:1px solid var(--line);margin-top:13px;padding-top:12px;color:var(--muted);font-size:11px}.owner-alert{background:#f3e8e7;border-radius:12px;padding:14px 16px;color:#74464a;font-size:12px;margin-bottom:18px}.owner-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.owner-box{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:18px}.owner-box h3{font:20px Georgia,serif;margin:0 0 8px}.owner-box p{font-size:12px;color:var(--muted);margin:0 0 14px}.owner-box button{margin-right:6px;margin-top:6px}.search{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 11px;font-size:12px}.modal{position:fixed;inset:0;background:#1e2925b9;display:none;place-items:center;padding:18px;z-index:4}.modal.open{display:grid}.modalbox{background:var(--white);border-radius:17px;padding:24px;width:min(440px,100%)}.modalbox h2{font:26px Georgia,serif;margin:0 0 8px}.modalbox p{font-size:13px;color:var(--muted)}.roleopt{width:100%;display:block;margin:9px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:white;text-align:left}.roleopt:hover{border-color:#809684}.small{color:var(--muted);font-size:11px}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);background:#27372f;color:white;border-radius:99px;padding:11px 17px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.staffcards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.layout{grid-template-columns:1fr}.side{display:none}.top{padding:0 16px}.wrap{padding:23px 16px}.title{align-items:start;gap:14px;flex-direction:column}.title h1{font-size:32px}.cards{gap:9px}.metric{padding:13px}.metric strong{font-size:25px}.table{display:block;overflow:auto}.owner-grid,.staffcards{grid-template-columns:1fr}.season{align-items:start;flex-direction:column}.bar{text-align:left}}
</style></head><body><div class="layout"><aside class="side"><div class="brand">scene <i>snap</i></div><div class="label">Workspace</div><nav class="nav" id="nav"><button class="active" data-page="overview">◫ &nbsp;Overview</button><button data-page="events">▦ &nbsp;Events & orders</button><button data-page="designs">✿ &nbsp;Design studio</button><button data-page="sourcing">□ &nbsp;Sourcing & stock</button><button data-page="schedule">◷ &nbsp;Team schedule</button><button data-page="customers">♡ &nbsp;Customers & leads</button><div class="label">Account</div><button data-page="staff">♙ &nbsp;Staff & permissions</button><button data-page="ceo" id="ceoNav" class="hidden">▣ &nbsp;CEO office</button></nav><div class="foot">Scene Snap Workroom<br><span id="accessLabel">Staff workspace · preview mode</span></div></aside><main class="main"><header class="top"><div class="left"><span class="eyebrow">Workroom</span><span class="badge" id="roleBadge">Staff preview</span></div><button class="user" onclick="document.getElementById('roleModal').classList.add('open')"><span class="avatar" id="userAvatar">SS</span><span><b id="userName" style="font-size:12px">Sample Team Member</b><br><span class="small" id="userRole">Employee</span></span>⌄</button></header><div class="wrap"><div id="page"></div></div></main></div><div class="modal" id="roleModal"><div class="modalbox"><div class="eyebrow">Preview access levels</div><h2>Choose a demo view</h2><p>These buttons preview the layout only. Real access is granted by verified accounts and database permissions.</p><button class="roleopt" onclick="setRole('customer')"><b>Customer</b><br><span class="small">Shop, designs, orders, and event inquiries.</span></button><button class="roleopt" onclick="setRole('employee')"><b>Approved employee</b><br><span class="small">Assigned work, events, sourcing, schedule, and customer notes.</span></button><button class="roleopt" onclick="setRole('ceo')"><b>CEO</b><br><span class="small">Business-wide controls, reports, people, and settings.</span></button><button class="btn alt" onclick="document.getElementById('roleModal').classList.remove('open')">Close</button></div></div><div class="toast" id="toast"></div><script>
let role='employee',page='overview';const events=[['Mila’s 16th birthday','Birthday · Atwood','NOV','29','In planning','wait'],['Winter market photo wall','Holiday · Goodland','DEC','06','Sourcing','review'],['Reed family wedding','Wedding · Hays','DEC','13','Confirmed',''],['Class of 2027 grad set','Graduation · Colby','MAY','16','New inquiry','review']];
function metric(label,value,trend,icon){return `<div class="metric"><div class="topline"><span>${label}</span><span class="bubble">${icon}</span></div><strong>${value}</strong><small>${trend}</small></div>`}
function eventRows(){return events.map(e=>`<tr><td><b>${e[0]}</b><br><span style="color:#738077">${e[1]}</span></td><td>${e[2]} ${e[3]}</td><td><span class="status ${e[5]}">${e[4]}</span></td><td><button class="link" onclick="toast('Event details open after database setup')">Open →</button></td></tr>`).join('')}
function panelEvents(){return `<div class="panel"><div class="panelhead"><h2>Upcoming events</h2><button class="link" onclick="go('events')">View all →</button></div><table class="table"><thead><tr><th>Event</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody>${eventRows()}</tbody></table></div>`}
function dashboard(){return `<div class="title"><div><div class="eyebrow">Sunday, November 22</div><h1>Good afternoon, ${role==='ceo'?'Owner':'team'}.</h1><p>Here’s the Scene Snap workroom at a glance.</p></div><button class="btn" onclick="toast('Create event opens when the database is connected')">＋ &nbsp;Create an event</button></div><div class="cards">${metric('Open inquiries','8','3 need a reply today','✉')}${metric('Events this month','12','4 events in the next 2 weeks','✿')}${metric('Unconfirmed sourcing','$426','Across 5 active events','□')}${metric('Booked this month','$2,840','Before expenses and taxes','↗')}</div><div class="columns">${panelEvents()}<div class="panel"><div class="panelhead"><h2>Today’s checklist</h2><button class="link" onclick="go('schedule')">Team schedule →</button></div><div class="list"><div class="row"><div class="datebox"><b>9:30</b><small>AM</small></div><div class="rowinfo"><strong>Confirm balloon arch colors</strong><span>Mila’s birthday · assigned to you</span></div></div><div class="row"><div class="datebox"><b>11:00</b><small>AM</small></div><div class="rowinfo"><strong>Pick up paper goods</strong><span>Town & Country Supply · 6 items</span></div></div><div class="row"><div class="datebox"><b>2:00</b><small>PM</small></div><div class="rowinfo"><strong>Reply to new graduation inquiry</strong><span>Class of 2027 · target under 1 day</span></div></div></div></div></div><div class="season"><div><h3>Season ahead · Holiday gatherings</h3><p>Plan stock, ready-to-book offers, and staff time before the seasonal rush.</p><div class="progress"><i></i></div></div><div class="bar"><b>64%</b><br><span>prep checklist complete</span></div></div>`}
function eventsPage(){return `<div class="title"><div><div class="eyebrow">Every occasion, in one place</div><h1>Events & orders</h1><p>Track inquiries, quotes, approvals, sourcing, and event-day work.</p></div><button class="btn" onclick="toast('New event form is ready for database wiring')">＋ &nbsp;New event</button></div><div class="tabs"><button class="tab active">All events · 12</button><button class="tab">Needs reply · 3</button><button class="tab">Confirmed · 6</button><button class="tab">Completed · 3</button></div>${panelEvents()}<div style="height:15px"></div><div class="panel"><div class="panelhead"><h2>Quote pipeline</h2><span class="small">Draft → sent → accepted → booked</span></div><div class="list"><div class="row"><div class="rowinfo"><strong>Mila’s 16th birthday</strong><span>Draft quote · backdrop + table styling + 2-hour setup</span></div><span class="status wait">Draft</span></div><div class="row"><div class="rowinfo"><strong>Class of 2027 grad set</strong><span>Inquiry received · event date May 16</span></div><span class="status review">Needs reply</span></div></div></div>`}
function designsPage(){return `<div class="title"><div><div class="eyebrow">Template library</div><h1>Design studio</h1><p>Create reusable templates, customize client designs, and send proofs for approval.</p></div><button class="btn" onclick="toast('Template editor available after sign-in is connected')">＋ &nbsp;New template</button></div><div class="inventory"><div class="stock"><strong>Garden Party</strong><span>Backdrop · Birthday / shower</span><b>Published · 8 custom requests</b></div><div class="stock"><strong>Modern Milestone</strong><span>Signs + table set · Graduation</span><b>Published · 5 custom requests</b></div><div class="stock"><strong>Golden Hour</strong><span>Tablescape · Wedding / anniversary</span><b>Draft · owner review</b></div><div class="stock"><strong>Little Star</strong><span>Welcome set · New baby</span><b>Published · 3 custom requests</b></div><div class="stock"><strong>Winter Glow</strong><span>Photo wall · Holiday</span><b>Seasonal · activate Dec 1</b></div></div>`}
function sourcingPage(){return `<div class="title"><div><div class="eyebrow">Keep every piece accounted for</div><h1>Sourcing & stock</h1><p>Supplier, expected cost, order status, pickup, inventory, and return tracking.</p></div><button class="btn" onclick="toast('Add supplier form available after database setup')">＋ &nbsp;Add sourcing item</button></div><div class="cards">${metric('Items to purchase','14','For 5 active events','□')}${metric('Low stock','3','Restock before Dec 1','!')}${metric('Expected spend','$638','Against $900 event budgets','↘')}${metric('Supplier orders','4','2 awaiting delivery','⌂')}</div><div class="panel"><div class="panelhead"><h2>Active sourcing list</h2><input class="search" placeholder="Search supplies…"></div><table class="table"><thead><tr><th>Item</th><th>Supplier</th><th>For event</th><th>Expected cost</th><th>Status</th></tr></thead><tbody><tr><td>Terracotta balloon set</td><td>Party Supply Co.</td><td>Mila’s birthday</td><td>$38.00</td><td><span class="status wait">To order</span></td></tr><tr><td>Backdrop stand · 8 ft</td><td>Scene Snap stock</td><td>Mila’s birthday</td><td>$0.00</td><td><span class="status">Reserved</span></td></tr><tr><td>Warm white LED candles · 24</td><td>Prairie Home</td><td>Reed wedding</td><td>$52.00</td><td><span class="status review">Awaiting delivery</span></td></tr><tr><td>Custom vinyl welcome sign</td><td>Local Print Shop</td><td>Winter market</td><td>$74.00</td><td><span class="status">Proof approved</span></td></tr></tbody></table></div>`}
function schedulePage(){return `<div class="title"><div><div class="eyebrow">People, time, and setup</div><h1>Team schedule</h1><p>Plan setup windows, assigned hours, travel, event coverage, and teardown.</p></div><button class="btn" onclick="toast('Schedule editor opens after database setup')">＋ &nbsp;Add shift</button></div><div class="panel"><div class="panelhead"><h2>Week of November 23</h2><div><button class="btn alt">‹</button> <button class="btn alt">›</button></div></div><div class="list"><div class="row"><div class="datebox"><b>24</b><small>TUE</small></div><div class="rowinfo"><strong>Mila’s birthday · setup 3:00–5:00 PM</strong><span>Travel 25 min · styling 2 hr · teardown 45 min · Brenn + 1 helper</span></div><span class="status wait">Needs helper</span></div><div class="row"><div class="datebox"><b>27</b><small>FRI</small></div><div class="rowinfo"><strong>Order pickup · Party Supply Co.</strong><span>Pickup window 10:00–11:00 AM · 6 items</span></div><span class="status">Assigned</span></div><div class="row"><div class="datebox"><b>29</b><small>SUN</small></div><div class="rowinfo"><strong>Mila’s birthday · event support 4:00–8:30 PM</strong><span>Setup 2 hr · event 2 hr · teardown 1 hr · travel 25 min</span></div><span class="status">Confirmed</span></div></div></div>`}
function customersPage(){return `<div class="title"><div><div class="eyebrow">Inquiries and relationships</div><h1>Customers & leads</h1><p>Keep contact details, preferences, quotes, and follow-up history together.</p></div><button class="btn" onclick="toast('Customer export requires owner permission')">Export contacts</button></div><div class="cards">${metric('New leads','8','This month','✉')}${metric('Returning clients','31%','Of completed events','♡')}${metric('Quote acceptance','68%','Last 90 days','✓')}${metric('Avg. response','5.2 hr','Business hours','◷')}</div><div class="panel"><div class="panelhead"><h2>Recent follow-ups</h2><input class="search" placeholder="Search customers…"></div><table class="table"><thead><tr><th>Contact</th><th>Event</th><th>Next step</th><th>Assigned</th></tr></thead><tbody><tr><td><b>Jamie R.</b><br><span style="color:#738077">jamie@example.com</span></td><td>Birthday · Nov 29</td><td>Confirm colors</td><td>Brenn</td></tr><tr><td><b>Alex P.</b><br><span style="color:#738077">alex@example.com</span></td><td>Graduation · May 16</td><td>Send first quote</td><td>Owner</td></tr></tbody></table></div>`}
function staffPage(){return `<div class="title"><div><div class="eyebrow">Verified work accounts</div><h1>Staff & permissions</h1><p>Only issued, verified staff accounts that the owner has approved get employee access.</p></div><button class="btn" onclick="toast('Invitation requires configured company email and authentication')">＋ &nbsp;Invite staff</button></div><div class="owner-alert"><b>How access works:</b> Signing in always starts as a customer. A verified company-issued email must match an approved staff record before work data appears. Permissions come from the assigned role, not from an email domain alone.</div><div class="staffcards"><article class="staff"><div class="stafftop"><div class="avatar">BW</div><div><h3>Brenn White</h3><p>Owner · verified account</p></div></div><div class="perm">Business-wide access · CEO office · finance · staff approvals</div></article><article class="staff"><div class="stafftop"><div class="avatar" style="background:#dce9dc">JM</div><div><h3>Jordan M.</h3><p>Design lead · verified company email</p></div></div><div class="perm">Assigned designs · proofs · customer notes · template drafts</div></article><article class="staff"><div class="stafftop"><div class="avatar" style="background:#eee4ca">TR</div><div><h3>Taylor R.</h3><p>Event assistant · verified company email</p></div></div><div class="perm">Assigned events · setup checklist · sourcing tasks · schedule</div></article></div><p class="small" style="margin-top:18px">Sample names and statuses are demonstration content. Real staff records belong in the protected database.</p>`}
function ceoPage(){return `<div class="title"><div><div class="eyebrow">Private owner area</div><h1>CEO office</h1><p>Business overview, owner approvals, finances, policy records, and settings.</p></div><span class="badge">CEO role required</span></div><div class="owner-alert"><b>Protected area.</b> In production, this page is accessible only when the server-side account role is CEO and the signed-in email matches the single owner account stored in private configuration.</div><div class="cards">${metric('Gross sales · month','$2,840','Before expenses / tax','↗')}${metric('Estimated costs','$1,176','Supplies, labor, travel','↘')}${metric('Open approvals','4','Quotes, purchases, proofs','!')}${metric('Upcoming booked','$5,460','Next 60 days','▦')}</div><div class="owner-grid"><article class="owner-box"><h3>Business & finance</h3><p>Sales, expenses, tax records, budgets, invoices, payment status, and monthly reports.</p><button class="btn alt" onclick="toast('Finance reports require live database and payment connection')">View reports</button><button class="btn alt" onclick="toast('Accounting export is not connected')">Export ledger</button></article><article class="owner-box"><h3>Approvals & decisions</h3><p>Review custom quotes, supplier purchases, design proofs, refunds, and discount requests.</p><button class="btn" onclick="go('events')">Review 4 approvals</button></article><article class="owner-box"><h3>Business records</h3><p>Store business plan, goals, services, pricing, policies, suppliers, insurance, licenses, and season plans.</p><button class="btn alt" onclick="toast('Private records are available after the secure database is configured')">Open business binder</button></article><article class="owner-box"><h3>People & access</h3><p>Invite company email accounts, assign least-privilege roles, pause access, and review activity history.</p><button class="btn alt" onclick="go('staff')">Manage staff access</button></article></div><div style="height:15px"></div><div class="panel"><div class="panelhead"><h2>Owner activity log</h2><button class="link" onclick="toast('Audit history becomes active with database setup')">View all →</button></div><div class="list"><div class="row"><div class="rowinfo"><strong>Design proof approved</strong><span>Winter market photo wall · Owner · Today 10:14 AM</span></div></div><div class="row"><div class="rowinfo"><strong>New staff access requested</strong><span>Waiting for owner review · Today 9:40 AM</span></div></div></div></div>`}
function customerPage(){return `<div class="title"><div><div class="eyebrow">Your celebrations</div><h1>Welcome to Scene Snap.</h1><p>Browse the scene shop, customize a design, or ask us to plan an event.</p></div><button class="btn" onclick="toast('Customer storefront opens on the Scene Snap site')">Shop scenes ↗</button></div><div class="cards">${metric('Saved designs','2','Keep working on your ideas','✿')}${metric('Open quotes','1','A response is on its way','✉')}${metric('Upcoming events','1','Next event Dec 13','▦')}${metric('Orders','3','Your order history','□')}</div><div class="panel"><div class="panelhead"><h2>Your latest update</h2><span class="status wait">Quote in progress</span></div><div class="list"><div class="row"><div class="rowinfo"><strong>Reed family wedding</strong><span>Golden Hour tablescape · Event date Dec 13 · Your quote is being prepared.</span></div><button class="link" onclick="toast('Customer account data is demo content')">View →</button></div></div></div>`}
function render(){document.getElementById('page').innerHTML=(role==='customer'?customerPage():page==='overview'?dashboard():page==='events'?eventsPage():page==='designs'?designsPage():page==='sourcing'?sourcingPage():page==='schedule'?schedulePage():page==='customers'?customersPage():page==='staff'?staffPage():page==='ceo'&&role==='ceo'?ceoPage():dashboard());document.getElementById('nav').classList.toggle('hidden',role==='customer');document.getElementById('ceoNav').classList.toggle('hidden',role!=='ceo');document.getElementById('roleBadge').textContent=role==='ceo'?'CEO preview':role==='customer'?'Customer preview':'Staff preview';document.getElementById('accessLabel').textContent=role==='ceo'?'CEO access · preview mode':role==='customer'?'Customer account · preview mode':'Staff workspace · preview mode';document.getElementById('userName').textContent=role==='ceo'?'Owner account':role==='customer'?'Sample Customer':'Sample Team Member';document.getElementById('userRole').textContent=role==='ceo'?'CEO':role==='customer'?'Customer':'Employee';document.getElementById('userAvatar').textContent=role==='ceo'?'OW':role==='customer'?'SC':'SS';document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page))}
function go(p){page=p;render()}document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});function setRole(r){role=r;page=r==='customer'?'overview':'overview';document.getElementById('roleModal').classList.remove('open');render()}function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2300)}render();
</script></body></html>
